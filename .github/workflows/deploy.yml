name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public value only: the Google sign-in client of the owner (not a secret).
      # Set it once as a repository variable (gh variable set GOOGLE_CLIENT_ID); while it is empty,
      # each device pastes it in the settings instead.
      VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Nothing goes live unless the database, library, sync and Drive checks all pass.
      - name: Tests
        run: |
          node scripts/make-fixtures.mjs
          npm run test:db
          npm run test:lib
          npm run test:sync
          npm run test:drive
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
